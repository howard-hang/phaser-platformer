name: android-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu 镜像自带 SDK。不再用 setup-android，它会去装已经下架的 tools 包。
      - name: 安装 compileSdk 36
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      # 测试只在 test-and-pages 里跑一次。这里只装依赖，不再装 Chrome。
      - name: 安装依赖
        run: npm ci

      - name: 构建网页并同步进安卓工程
        run: |
          npm run build
          npx cap sync android

      - name: 打包调试签名 APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 整理 APK 文件名
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fangkuai-paoku-debug.apk

      - name: 检查包名、名称、横屏和离线资源
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging fangkuai-paoku-debug.apk | tee badging.txt
          grep -q "package: name='com.fangkuai.paoku'" badging.txt
          # 默认英语兜底。简体走 zh / zh-CN，繁体走 zh-TW / zh-HK，其它已翻译语言仍是 Block Runner。
          grep -qx "application-label:'Block Runner'" badging.txt
          grep -qx "application-label-zh:'方块跑酷'" badging.txt
          grep -qx "application-label-zh-CN:'方块跑酷'" badging.txt
          grep -qx "application-label-zh-TW:'方塊跑酷'" badging.txt
          grep -qx "application-label-zh-HK:'方塊跑酷'" badging.txt
          grep -qx "application-label-en:'Block Runner'" badging.txt
          grep -qx "application-label-es:'Block Runner'" badging.txt
          grep -qx "application-label-ja:'Block Runner'" badging.txt
          grep -qx "application-label-ko:'Block Runner'" badging.txt
          "$AAPT" dump xmltree fangkuai-paoku-debug.apk AndroidManifest.xml | tee manifest.txt
          # aapt 把 sensorLandscape 编成整数 6（SCREEN_ORIENTATION_SENSOR_LANDSCAPE）。
          grep -q 'android:screenOrientation(0x0101001e)=(type 0x10)0x6' manifest.txt
          unzip -l fangkuai-paoku-debug.apk > apk-list.txt
          grep -q "assets/public/index.html" apk-list.txt
          grep -q "assets/public/assets/game-font" apk-list.txt
          grep -q "assets/public/assets/.*\.ogg" apk-list.txt
          grep -q "ic_launcher.png" apk-list.txt
          # cap sync 必须把 AdMob 写进插件清单，清单里也要有应用 ID。
          grep -q "com.getcapacitor.community.admob.AdMob" android/app/src/main/assets/capacitor.plugins.json
          grep -q "com.google.android.gms.ads.APPLICATION_ID" manifest.txt
          grep -q "com.google.android.gms.permission.AD_ID" manifest.txt
          mkdir -p /tmp/debug-web
          unzip -o fangkuai-paoku-debug.apk 'assets/public/assets/*.js' -d /tmp/debug-web >/dev/null
          cat /tmp/debug-web/assets/public/assets/*.js > /tmp/debug-web.js
          # 调试构建没有把开关收成字符串 false。两个模式的函数体都会留在包里，不能靠缺哪个词来判断。
          if grep -q 'return`false`' /tmp/debug-web.js; then
            echo '调试包不应把 VITE_ADMOB_USE_TEST_ADS 收成 false'
            exit 1
          fi
          grep -q 'test-rewarded' /tmp/debug-web.js

      - uses: actions/upload-artifact@v4
        with:
          name: fangkuai-paoku-debug
          path: fangkuai-paoku-debug.apk
          if-no-files-found: error

      # 四个密钥都空着：用一次性密钥把 release 打出来做清单检查，产物不上传。
      # 只填了一部分：失败，避免把临时密钥当成上传密钥。
      - name: 准备正式签名
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then present=$((present + 1)); fi
          done
          mkdir -p "$RUNNER_TEMP"
          if [ "$present" -eq 4 ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "ANDROID_KEYSTORE_PASSWORD<<EOF"
              echo "$ANDROID_KEYSTORE_PASSWORD"
              echo "EOF"
              echo "ANDROID_KEY_ALIAS<<EOF"
              echo "$ANDROID_KEY_ALIAS"
              echo "EOF"
              echo "ANDROID_KEY_PASSWORD<<EOF"
              echo "$ANDROID_KEY_PASSWORD"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload.keystore" \
              -storetype PKCS12 \
              -alias ci-ephemeral \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass ci-ephemeral -keypass ci-ephemeral \
              -dname "CN=CI Ephemeral, OU=CI, O=CI, L=CI, ST=CI, C=US"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-ephemeral" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=ci-ephemeral" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=ci-ephemeral" >> "$GITHUB_ENV"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "未配置上传密钥，只检查 release 清单，不上传 AAB。"
          else
            echo "签名 Secrets 只填了一部分。四个都要有，或者都留空。"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.0" >> "$GITHUB_ENV"

      - name: 用真实广告位构建网页并打 release
        env:
          VITE_ADMOB_USE_TEST_ADS: 'false'
        run: |
          npm run build
          npx cap sync android
          cd android && ./gradlew bundleRelease assembleRelease --stacktrace

      - name: 检查 release 清单
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab fangkuai-paoku-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk fangkuai-paoku-release.apk
          test -s fangkuai-paoku-release.aab
          test -s fangkuai-paoku-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$ZIPALIGN"
          "$AAPT" dump badging fangkuai-paoku-release.apk | tee release-badging.txt
          grep -q "package: name='com.fangkuai.paoku' versionCode='${{ github.run_number }}' versionName='1.0.0'" release-badging.txt
          grep -q "sdkVersion:'24'" release-badging.txt
          grep -q "targetSdkVersion:'36'" release-badging.txt
          if grep -q 'application-debuggable' release-badging.txt; then
            echo 'release 包不能是 debuggable'
            exit 1
          fi
          "$AAPT" dump permissions fangkuai-paoku-release.apk | tee release-perms.txt
          grep -q "com.google.android.gms.permission.AD_ID" release-perms.txt
          grep -q "android.permission.INTERNET" release-perms.txt
          grep -q "android.permission.VIBRATE" release-perms.txt
          for bad in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_PHONE_STATE WRITE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE CAMERA RECORD_AUDIO REQUEST_INSTALL_PACKAGES QUERY_ALL_PACKAGES GET_ACCOUNTS READ_CONTACTS; do
            if grep -q "$bad" release-perms.txt; then
              echo "多余权限 $bad"
              exit 1
            fi
          done
          "$AAPT" dump xmltree fangkuai-paoku-release.apk AndroidManifest.xml | tee release-manifest.txt
          grep -q 'android:debuggable' release-manifest.txt && { echo '清单里不应出现 debuggable'; exit 1; } || true
          grep -q "com.google.android.gms.ads.APPLICATION_ID" release-manifest.txt
          grep -q "ca-app-pub-3218611878548189~9810569030" release-manifest.txt
          mkdir -p /tmp/release-web
          unzip -o fangkuai-paoku-release.apk 'assets/public/assets/*.js' -d /tmp/release-web >/dev/null
          cat /tmp/release-web/assets/public/assets/*.js > /tmp/release-web.js
          # readViteTestFlag 被收成 return`false`。调试包标志仍会在运行时盖过它。
          grep -q 'return`false`' /tmp/release-web.js
          grep -q 'live-rewarded' /tmp/release-web.js
          grep -q 'ca-app-pub-3218611878548189/5871324026' /tmp/release-web.js
          # 16 KB：未压缩的 .so 在 APK 里按页对齐。没有原生库时 zipalign -P 16 仍应通过。
          "$ZIPALIGN" -c -P 16 4 fangkuai-paoku-release.apk
          python3 - << 'PY'
          import struct, sys, zipfile
          z = zipfile.ZipFile('fangkuai-paoku-release.apk')
          sos = [n for n in z.namelist() if n.endswith('.so')]
          print('native libs', len(sos))
          bad = []
          for name in sos:
              data = z.read(name)
              if data[:4] != b'\x7fELF' or data[4] != 2:
                  bad.append((name, 'not-elf64'))
                  continue
              e_phoff = struct.unpack_from('<Q', data, 32)[0]
              e_phentsize = struct.unpack_from('<H', data, 54)[0]
              e_phnum = struct.unpack_from('<H', data, 56)[0]
              for i in range(e_phnum):
                  off = e_phoff + i * e_phentsize
                  p_type, = struct.unpack_from('<I', data, off)
                  if p_type != 1:
                      continue
                  p_align, = struct.unpack_from('<Q', data, off + 48)
                  if p_align < 16384:
                      bad.append((name, p_align))
          if bad:
              print('16KB ELF alignment failed', bad)
              sys.exit(1)
          print('16KB ELF alignment OK')
          PY

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: fangkuai-paoku-release
          path: |
            fangkuai-paoku-release.aab
            fangkuai-paoku-release.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fangkuai-paoku-debug
          path: dist-apk

      - name: 发布调试 APK 到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 没有 checkout，本地不是 git 仓库。不写 GH_REPO 的话 gh 会去跑 git 并失败。
          GH_REPO: ${{ github.repository }}
        run: |
          REPO="${{ github.repository }}"
          # 同一个标签反复更新，下载地址保持稳定。旧文件先删掉再挂上新的包。
          if gh release view android-debug --repo "$REPO" >/dev/null 2>&1; then
            gh release delete android-debug --yes --cleanup-tag --repo "$REPO"
          fi
          gh release create android-debug dist-apk/fangkuai-paoku-debug.apk \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "方块跑酷 Android 调试包" \
            --prerelease \
            --notes "$(cat <<'EOF'
          调试签名 APK，可以直接安装，不能上架商店。

          - 桌面名称：方块跑酷
          - 包名：com.fangkuai.paoku
          - 横屏全屏，游戏内容与网页版同一份构建
          - 资源打进安装包，断网可玩
          - 返回键：关卡中回到选关，选关回到标题，标题退出应用

          文件：fangkuai-paoku-debug.apk
          EOF
          )"
